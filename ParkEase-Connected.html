  };

  const deleteUser = (id) => {
    if (!window.confirm('Are you sure you want to delete this user? This cannot be undone.')) return;
    const all = DB.getArr('users').filter(u => u.id !== id);
    DB.set('users', all);
    setUsers(all.filter(u => u.role === 'user'));
    toast('User deleted successfully');
  };

  const deleteAllUsers = () => {
    if (!window.confirm('Are you sure you want to delete ALL users? This cannot be undone.')) return;
    const all = DB.getArr('users').filter(u => u.role !== 'user');
    DB.set('users', all);
    setUsers([]);
    toast('All users deleted');
  };

  return (
    <div className="page-padding fade-in">
      <div className="mb-6">
        <h2 className="section-title">User Management</h2>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 10 }}>
          <p className="section-sub">{users.length} registered users</p>
          {users.length > 0 && (
            <button className="btn btn-sm" onClick={deleteAllUsers} style={{ fontSize: 12, background: '#fee2e2', color: '#dc2626', border: '1px solid #fca5a5', fontWeight: 600 }}>
              🗑 Delete All Users
            </button>
          )}
        </div>
      </div>
      <div className="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Joined</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {users.map(u => (
              <tr key={u.id}>
                <td>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <div style={{ width: 32, height: 32, borderRadius: '50%', background: '#dbeafe', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 700, color: '#2563eb', fontSize: 13 }}>
                      {u.name.charAt(0)}
                    </div>
                    <span style={{ fontWeight: 600 }}>{u.name}</span>
                  </div>
                </td>
                <td>{u.email}</td>
                <td>{u.phone || '—'}</td>
                <td style={{ color: '#64748b', fontSize: 13 }}>{new Date(u.createdAt).toLocaleDateString()}</td>
                <td><span className={`badge ${u.isActive !== false ? 'badge-green' : 'badge-red'}`}>{u.isActive !== false ? 'Active' : 'Suspended'}</span></td>
                <td>
                  <div style={{ display: 'flex', gap: 6 }}>
                    <button className="btn btn-secondary btn-sm" onClick={() => toggleUser(u.id)} style={{ fontSize: 12 }}>
                      {u.isActive !== false ? 'Suspend' : 'Activate'}
                    </button>
                    <button className="btn btn-sm" onClick={() => deleteUser(u.id)} style={{ fontSize: 12, background: '#fee2e2', color: '#dc2626', border: '1px solid #fca5a5' }}>
                      Delete
                    </button>
                  </div>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ============================================================
// ADMIN OWNER KYC VERIFICATION
// ============================================================
const ODB_admin = {
  get: (k, def = null) => { try { const v = localStorage.getItem('pe_owner_' + k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set: (k, v) => { try { localStorage.setItem('pe_owner_' + k, JSON.stringify(v)); } catch {} },
  getArr: (k) => ODB_admin.get(k, [])
};

const AdminOwnerVerification = () => {
  const [owners, setOwners] = React.useState(ODB_admin.getArr('owners'));
  const [properties, setProperties] = React.useState(ODB_admin.getArr('properties'));
  const [selected, setSelected] = React.useState(null);
  const [propSelected, setPropSelected] = React.useState(null);
  const [rejReason, setRejReason] = React.useState('');
  const [propStatus, setPropStatus] = React.useState('');
  const [tab, setTab] = React.useState('kyc'); // kyc | properties

  const refresh = () => {
    setOwners(ODB_admin.getArr('owners'));
    setProperties(ODB_admin.getArr('properties'));
  };

  const approveKYC = (owner) => {
    const updated = owners.map(o => o.ownerId === owner.ownerId
      ? { ...o, kycStatus: 'Approved', verifiedBy: 'admin1', verifiedAt: new Date().toISOString(), rejectionReason: null }
      : o);
    ODB_admin.set('owners', updated);
    const notifs = ODB_admin.getArr('notifications');
    ODB_admin.set('notifications', [...notifs, { id: 'n' + Date.now(), ownerId: owner.ownerId, type: 'kyc', message: '✅ Your KYC has been approved! You can now list your properties.', createdAt: new Date().toISOString(), read: false }]);
    setSelected(null);
    refresh();
    toast('KYC Approved ✅');
  };

  const rejectKYC = (owner) => {
    if (!rejReason.trim()) { toast('Enter rejection reason', 'error'); return; }
    const updated = owners.map(o => o.ownerId === owner.ownerId
      ? { ...o, kycStatus: 'Rejected', rejectionReason: rejReason, verifiedBy: 'admin1', verifiedAt: new Date().toISOString() }
      : o);
    ODB_admin.set('owners', updated);
    const notifs = ODB_admin.getArr('notifications');
    ODB_admin.set('notifications', [...notifs, { id: 'n' + Date.now(), ownerId: owner.ownerId, type: 'kyc', message: `❌ KYC rejected: ${rejReason}`, createdAt: new Date().toISOString(), read: false }]);
    setSelected(null);
    setRejReason('');
    refresh();
    toast('KYC Rejected');
  };

  const updatePropertyStatus = async (prop, status) => {
    // 1. Update localStorage so owner portal reflects it
    const updated = properties.map(p => p.propertyId === prop.propertyId ? { ...p, deploymentStatus: status } : p);
    ODB_admin.set('properties', updated);

    // 2. Add notification for the owner
    const notifs = ODB_admin.getArr('notifications');
    ODB_admin.set('notifications', [...notifs, { id: 'n' + Date.now(), ownerId: prop.ownerId, type: 'property', message: `Property "${prop.propertyName}" status updated to: ${status}`, createdAt: new Date().toISOString(), read: false }]);

    // 3. Sync with backend parkease-db.json so it appears in Locations & User pages
    try {
      if (status === 'Live') {
        // Promote property → station in backend DB
        const r = await fetch(`${API_BASE}/api/stations/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            propertyName: prop.propertyName,
            address:      prop.address,
            city:         prop.city,
            latitude:     prop.latitude,
            longitude:    prop.longitude,
            capacity:     prop.capacity,
            electricity:  prop.electricity,
            internet:     prop.internet,
            propertyType: prop.propertyType,
            propertyId:   prop.propertyId,
            ownerId:      prop.ownerId
          })
        });
        const data = await r.json();
        if (data.success) {
          toast(`🚀 "${prop.propertyName}" is now LIVE and visible to users!`);
        } else {
          toast(`Status saved but station sync failed: ${data.message}`, 'error');
        }
      } else if (status === 'Rejected') {
        // If it was previously live, remove it from stations
        const checkR = await fetch(`${API_BASE}/api/stations/by-property/${prop.propertyId}`);
        const checkData = await checkR.json();
        if (checkData.exists && checkData.station) {
          await fetch(`${API_BASE}/api/stations/${checkData.station.id}`, { method: 'DELETE' });
          toast(`Property "${prop.propertyName}" removed from live stations.`);
        } else {
          toast(`Property status updated to Rejected.`);
        }
      } else {
        toast(`Status updated to "${status}"`);
      }
    } catch (err) {
      toast(`Status saved locally. Backend sync failed — is the server running?`, 'error');
    }

    setPropSelected(null);
    refresh();
  };

  const kycBadge = { Pending: { cls: 'badge', style: { background:'#fef3c7', color:'#92400e' } }, Approved: { cls: 'badge', style: { background:'#d1fae5', color:'#065f46' } }, Rejected: { cls: 'badge', style: { background:'#fee2e2', color:'#991b1b' } } };
  const deployStatuses = ['Pending Review', 'Approved', 'Deployment Scheduled', 'In Installation', 'Live', 'Rejected'];

  const fmtD = (d) => d ? new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }) : '—';

  return (
    <div style={{ padding: 28 }}>
      <div style={{ display:'flex', gap:0, marginBottom:20, background:'#f1f5f9', borderRadius:10, padding:4, width:'fit-content' }}>
        {[['kyc','🪪 Owner KYC'],['properties','🏗️ Properties']].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} style={{ padding:'8px 18px', borderRadius:8, border:'none', background: tab===id ? 'white' : 'transparent', fontWeight:700, fontSize:13, cursor:'pointer', boxShadow: tab===id ? '0 1px 4px rgba(0,0,0,.08)' : 'none', color: tab===id ? '#0f172a' : '#64748b' }}>{label}</button>
        ))}
      </div>

      {tab === 'kyc' && (
        <div>
          <div style={{ marginBottom:16, display:'flex', gap:12 }}>
            {[['All', null],['Pending','Pending'],['Approved','Approved'],['Rejected','Rejected']].map(([label, val]) => {
              const count = val ? owners.filter(o => o.kycStatus === val).length : owners.length;
              return <div key={label} style={{ background:'white', border:'1px solid #e2e8f0', borderRadius:8, padding:'8px 16px', fontSize:13, fontWeight:600 }}>{label}: {count}</div>;
            })}
          </div>
          <div style={{ background:'white', borderRadius:12, border:'1px solid #e2e8f0', overflow:'hidden' }}>
            <table style={{ width:'100%', borderCollapse:'collapse' }}>
              <thead>
                <tr style={{ background:'#f8fafc' }}>
                  {['Owner','Email','Phone','ID Type','Submitted','Status','Actions'].map(h => <th key={h} style={{ padding:'12px 16px', textAlign:'left', fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'.5px', borderBottom:'1px solid #e2e8f0' }}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {owners.length === 0 && <tr><td colSpan={7} style={{ textAlign:'center', padding:40, color:'#94a3b8' }}>No owner registrations yet</td></tr>}
                {owners.map(o => (
                  <tr key={o.ownerId} style={{ borderBottom:'1px solid #e2e8f0' }}>
                    <td style={{ padding:'12px 16px', fontWeight:600 }}>{o.name}</td>
                    <td style={{ padding:'12px 16px', fontSize:13, color:'#64748b' }}>{o.email}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{o.phone}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{o.idType || '—'}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{fmtD(o.createdAt)}</td>
                    <td style={{ padding:'12px 16px' }}><span style={{ ...kycBadge[o.kycStatus]?.style, padding:'3px 10px', borderRadius:20, fontSize:12, fontWeight:600 }}>{o.kycStatus === 'Pending' ? '🟡' : o.kycStatus === 'Approved' ? '🟢' : '🔴'} {o.kycStatus}</span></td>
                    <td style={{ padding:'12px 16px' }}>
                      <button onClick={() => setSelected(o)} style={{ background:'linear-gradient(135deg,#1e3a8a,#2563eb)', color:'white', border:'none', padding:'6px 12px', borderRadius:7, fontSize:12, fontWeight:700, cursor:'pointer' }}>Review</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {tab === 'properties' && (
        <div style={{ background:'white', borderRadius:12, border:'1px solid #e2e8f0', overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <thead>
              <tr style={{ background:'#f8fafc' }}>
                {['Property','Owner','City','Type','Capacity','Submitted','Status','Actions'].map(h => <th key={h} style={{ padding:'12px 16px', textAlign:'left', fontSize:11, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'.5px', borderBottom:'1px solid #e2e8f0' }}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {properties.length === 0 && <tr><td colSpan={8} style={{ textAlign:'center', padding:40, color:'#94a3b8' }}>No properties submitted yet</td></tr>}
              {properties.map(p => {
                const owner = owners.find(o => o.ownerId === p.ownerId);
                const badgeColors = { 'Pending Review':'#fef3c7', 'Approved':'#d1fae5', 'Deployment Scheduled':'#dbeafe', 'In Installation':'#ede9fe', 'Live':'#d1fae5', 'Rejected':'#fee2e2' };
                const textColors = { 'Pending Review':'#92400e', 'Approved':'#065f46', 'Deployment Scheduled':'#1e40af', 'In Installation':'#5b21b6', 'Live':'#065f46', 'Rejected':'#991b1b' };
                return (
                  <tr key={p.propertyId} style={{ borderBottom:'1px solid #e2e8f0' }}>
                    <td style={{ padding:'12px 16px', fontWeight:600 }}>{p.propertyName}</td>
                    <td style={{ padding:'12px 16px', fontSize:13, color:'#64748b' }}>{owner?.name || '—'}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{p.city}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{p.propertyType}</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{p.capacity} slots</td>
                    <td style={{ padding:'12px 16px', fontSize:13 }}>{fmtD(p.createdAt)}</td>
                    <td style={{ padding:'12px 16px' }}><span style={{ background: badgeColors[p.deploymentStatus] || '#f1f5f9', color: textColors[p.deploymentStatus] || '#64748b', padding:'3px 10px', borderRadius:20, fontSize:12, fontWeight:600 }}>{p.deploymentStatus}</span></td>
                    <td style={{ padding:'12px 16px' }}>
                      <button onClick={() => { setPropSelected(p); setPropStatus(p.deploymentStatus); }} style={{ background:'linear-gradient(135deg,#1e3a8a,#2563eb)', color:'white', border:'none', padding:'6px 12px', borderRadius:7, fontSize:12, fontWeight:700, cursor:'pointer' }}>Update</button>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {/* KYC Review Modal */}
      {selected && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,.6)', zIndex:1000, display:'flex', alignItems:'center', justifyContent:'center', padding:20 }}>
          <div style={{ background:'white', borderRadius:16, width:'100%', maxWidth:680, maxHeight:'92vh', overflowY:'auto', boxShadow:'0 20px 60px rgba(0,0,0,.3)' }}>
            {/* Header */}
            <div style={{ padding:'20px 24px 16px', borderBottom:'1px solid #e2e8f0', display:'flex', justifyContent:'space-between', alignItems:'center', position:'sticky', top:0, background:'white', zIndex:1, borderRadius:'16px 16px 0 0' }}>
              <div>
                <h2 style={{ fontSize:18, fontWeight:700, margin:0 }}>🪪 KYC Review — {selected.name}</h2>
                <p style={{ fontSize:13, color:'#64748b', margin:'3px 0 0' }}>{selected.email} · {selected.phone}</p>
              </div>
              <button onClick={() => { setSelected(null); setRejReason(''); }} style={{ background:'#f1f5f9', border:'none', borderRadius:8, padding:'6px 10px', cursor:'pointer', fontSize:18, lineHeight:1 }}>✕</button>
            </div>

            <div style={{ padding:'20px 24px' }}>
              {/* Owner Info Grid */}
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:12, marginBottom:20 }}>
                {[['ID Type', selected.idType||'—'], ['ID Number', selected.idNumber||'—'], ['Submitted', fmtD(selected.createdAt)], ['Status', selected.kycStatus]].map(([k, v]) => (
                  <div key={k} style={{ background:'#f8fafc', borderRadius:10, padding:'10px 12px' }}>
                    <div style={{ fontSize:10, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'.5px', marginBottom:3 }}>{k}</div>
                    <div style={{ fontWeight:700, fontSize:13 }}>{v}</div>
                  </div>
                ))}
              </div>

              {/* Document Images */}
              <div style={{ marginBottom:20 }}>
                <div style={{ fontSize:12, fontWeight:700, color:'#64748b', textTransform:'uppercase', letterSpacing:'.5px', marginBottom:10 }}>📎 KYC Documents</div>
                <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14 }}>
                  {/* ID Proof */}
                  <div>
                    <div style={{ fontSize:12, fontWeight:600, color:'#0f172a', marginBottom:6 }}>ID Proof ({selected.idType})</div>
                    {selected.idDocumentPath ? (
                      selected.idDocumentPath.startsWith('data:image') ? (
                        <img src={selected.idDocumentPath} alt="ID Document" style={{ width:'100%', borderRadius:10, border:'2px solid #e2e8f0', objectFit:'cover', maxHeight:200, cursor:'pointer' }} onClick={() => window.open(selected.idDocumentPath, '_blank')} title="Click to open full size" />
                      ) : selected.idDocumentPath.startsWith('data:application/pdf') ? (
                        <div style={{ background:'#fef3c7', border:'2px solid #fcd34d', borderRadius:10, padding:20, textAlign:'center' }}>
                          <div style={{ fontSize:36, marginBottom:6 }}>📄</div>
                          <div style={{ fontSize:12, fontWeight:600, color:'#92400e', marginBottom:8 }}>PDF Document</div>
                          <a href={selected.idDocumentPath} download="id_proof.pdf" style={{ background:'#d97706', color:'white', padding:'6px 14px', borderRadius:7, fontSize:12, fontWeight:700, textDecoration:'none', display:'inline-block' }}>⬇ Download PDF</a>
                        </div>
                      ) : (
                        <div style={{ background:'#f0fdf4', border:'2px solid #86efac', borderRadius:10, padding:20, textAlign:'center' }}>
                          <div style={{ fontSize:32 }}>✅</div>
                          <div style={{ fontSize:12, color:'#065f46', fontWeight:600, marginTop:6 }}>Document uploaded</div>
                        </div>
                      )
                    ) : (
                      <div style={{ background:'#fef2f2', border:'2px dashed #fca5a5', borderRadius:10, padding:20, textAlign:'center' }}>
                        <div style={{ fontSize:32 }}>❌</div>
                        <div style={{ fontSize:12, color:'#991b1b', fontWeight:600, marginTop:6 }}>Not uploaded</div>
                      </div>
                    )}
                  </div>

                  {/* Selfie with ID */}
                  <div>
                    <div style={{ fontSize:12, fontWeight:600, color:'#0f172a', marginBottom:6 }}>Selfie with ID</div>
                    {selected.selfiePath ? (
                      selected.selfiePath.startsWith('data:image') ? (
                        <img src={selected.selfiePath} alt="Selfie with ID" style={{ width:'100%', borderRadius:10, border:'2px solid #e2e8f0', objectFit:'cover', maxHeight:200, cursor:'pointer' }} onClick={() => window.open(selected.selfiePath, '_blank')} title="Click to open full size" />
                      ) : (
                        <div style={{ background:'#f0fdf4', border:'2px solid #86efac', borderRadius:10, padding:20, textAlign:'center' }}>
                          <div style={{ fontSize:32 }}>✅</div>
                          <div style={{ fontSize:12, color:'#065f46', fontWeight:600, marginTop:6 }}>Selfie uploaded</div>
                        </div>
                      )
                    ) : (
                      <div style={{ background:'#fef2f2', border:'2px dashed #fca5a5', borderRadius:10, padding:20, textAlign:'center' }}>
                        <div style={{ fontSize:32 }}>❌</div>
                        <div style={{ fontSize:12, color:'#991b1b', fontWeight:600, marginTop:6 }}>Not uploaded</div>
                      </div>
                    )}
                  </div>
                </div>
                <p style={{ fontSize:11, color:'#94a3b8', marginTop:8 }}>💡 Click on images to view full size in a new tab</p>
              </div>

              {/* Rejection reason */}
              {selected.kycStatus !== 'Approved' && (
                <div style={{ marginBottom:16 }}>
                  <label style={{ display:'block', fontSize:13, fontWeight:600, marginBottom:6 }}>Rejection Reason <span style={{ color:'#94a3b8', fontWeight:400 }}>(required if rejecting)</span></label>
                  <textarea style={{ width:'100%', padding:'10px 12px', border:'1.5px solid #e2e8f0', borderRadius:10, fontSize:13, fontFamily:'inherit', resize:'vertical', minHeight:70 }} placeholder="e.g. Blurry document, ID number mismatch, Selfie not clear..." value={rejReason} onChange={e => setRejReason(e.target.value)} />
                </div>
              )}

              {/* Action Buttons */}
              <div style={{ display:'flex', gap:10, justifyContent:'flex-end', paddingTop:4 }}>
                <button onClick={() => { setSelected(null); setRejReason(''); }} style={{ padding:'9px 18px', borderRadius:9, border:'1.5px solid #e2e8f0', background:'white', fontWeight:600, fontSize:13, cursor:'pointer' }}>Cancel</button>
                <button onClick={() => rejectKYC(selected)} style={{ padding:'9px 18px', borderRadius:9, border:'none', background:'linear-gradient(135deg,#991b1b,#dc2626)', color:'white', fontWeight:700, fontSize:13, cursor:'pointer' }}>❌ Reject KYC</button>
                <button onClick={() => approveKYC(selected)} style={{ padding:'9px 18px', borderRadius:9, border:'none', background:'linear-gradient(135deg,#065f46,#059669)', color:'white', fontWeight:700, fontSize:13, cursor:'pointer' }}>✅ Approve KYC</button>

            {/* Header */}

    setLoading(true);

      fetch(`${API_BASE}/api/flagged-alerts`).then(r => r.json()).catch(() => ({ alerts: [] })),
      fetch(`${API_BASE}/api/flagged-vehicles`).then(r => r.json()).catch(() => ({ vehicles: [] }))
    ]).then(([a, v]) => {
      setAlerts(a.alerts || []);
      setVehicles(v.vehicles || []);
      // Show popup for most recent unacknowledged alert

        setPopupData(recent);
        setShowPopup(true);

  React.useEffect(() => { load(); }, []);

  const addFlagged = async () => {

        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

const App = () => {
  const [authMode, setAuthMode] = useState('login');
  const [user, setUser] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [selectedLocation, setSelectedLocation] = useState(null);
  const [apiStatus, setApiStatus] = useState('checking'); // 'checking' | 'connected' | 'offline'
  const [flaggedToast, setFlaggedToast] = useState(null);

  // Poll for new flagged alerts every 15s (admin only)
  useEffect(() => {
    if (!user || user.role !== 'admin') return;
    let lastCount = null;
    const poll = async () => {
      try {
        const r = await fetch(`${API_BASE}/api/flagged-alerts`);
        const d = await r.json();
        const alerts = d.alerts || [];
        if (lastCount !== null && alerts.length > lastCount) {
          const newest = alerts[0];
          if (newest && !sessionStorage.getItem('toast_' + newest.id)) {
            sessionStorage.setItem('toast_' + newest.id, '1');
            setFlaggedToast(newest);
            setTimeout(() => setFlaggedToast(null), 20000);
          }
        }
        lastCount = alerts.length;
      } catch {}
    };
    poll();
    const iv = setInterval(poll, 15000);
    return () => clearInterval(iv);
  }, [user]);

  useEffect(() => { 
    initData();
    // Auto-login if redirected from admin-login page
    const params = new URLSearchParams(window.location.search);
    if (params.get('admin') === '1') {
      try {
        const session = localStorage.getItem('pe_admin_session');
        if (session) {
          const { user: u } = JSON.parse(session);
          if (u && u.role === 'admin') {
            handleLogin(u);
            // Clean URL
            window.history.replaceState({}, '', window.location.pathname);
          }
        }
      } catch(e) {}
    }
    // Check API connectivity
    fetch(`${API_BASE}/api/health`)
      .then(r => r.json())
      .then(d => d.status === 'OK' ? setApiStatus('connected') : setApiStatus('offline'))
      .catch(() => setApiStatus('offline'));
  }, []);

  const handleLogin = (u) => {
    setUser(u);
    setPage(u.role === 'admin' ? 'admin-dashboard' : 'dashboard');
  };

  const handleLogout = () => {
    setUser(null);
    setPage('dashboard');
    setSelectedLocation(null);
    toast('Logged out successfully', 'info');
  };

  if (!user) {
    return (
      <>
        <ToastContainer />
        {apiStatus === 'offline' && (
          <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999, background: '#fef3c7', borderBottom: '2px solid #f59e0b', padding: '10px 20px', display: 'flex', alignItems: 'center', gap: 10, fontSize: 13, fontWeight: 600, color: '#92400e' }}>
            ⚠️ Backend API is not reachable at {API_BASE}. Run: <code style={{ background: '#fde68a', padding: '2px 6px', borderRadius: 4 }}>node parkease-backend-api.js</code> — Parking stations & bookings require the backend.
          </div>
        )}
        {apiStatus === 'connected' && (
          <div style={{ position: 'fixed', top: 0, left: 0, right: 0, zIndex: 9999, background: '#f0fdf4', borderBottom: '2px solid #86efac', padding: '8px 20px', display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, fontWeight: 600, color: '#166534' }}>
            ✅ Connected to ParkEase backend API at {API_BASE}
          </div>
        )}
        {authMode === 'login'
          ? <LoginPage onLogin={handleLogin} switchToRegister={() => setAuthMode('register')} />
          : <RegisterPage onLogin={handleLogin} switchToLogin={() => setAuthMode('login')} />
        }
      </>
    );
  }

  // Booking flow
  if (page === 'locations' && selectedLocation) {
    return (
      <div className="app-shell">
        <Sidebar page={page} setPage={(p) => { setPage(p); setSelectedLocation(null); }} user={user} onLogout={handleLogout} />
        <div className="main-content">
          <Topbar page={page} user={user} />
          <BookingPage
            location={selectedLocation}
            user={user}
            onBack={() => setSelectedLocation(null)}
            onBookingComplete={() => { setSelectedLocation(null); setPage('bookings'); }}
          />
        </div>
        <ToastContainer />
      </div>
    );
  }

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <Dashboard user={user} setPage={setPage} />;
      case 'locations': return <LocationsPage user={user} onSelectLocation={setSelectedLocation} />;
      case 'bookings': return <BookingsPage user={user} />;
      case 'camera': return <CameraPage />;
      case 'profile': return <ProfilePage user={user} setUser={setUser} />;
      case 'admin-dashboard': return <AdminDashboard />;
      case 'admin-locations': return <AdminLocations />;
      case 'admin-bookings': return <AdminBookings />;
      case 'admin-users': return <AdminUsers />;
      case 'admin-owner-verification': return <AdminOwnerVerification />;
      case 'admin-flagged-alerts': return <AdminFlaggedAlerts />;
      default: return <Dashboard user={user} setPage={setPage} />;
    }
  };

  return (
    <div className="app-shell">
      <Sidebar page={page} setPage={setPage} user={user} onLogout={handleLogout} />
      <div className="main-content">
        <Topbar page={page} user={user} />
        {renderPage()}
      </div>
      <ToastContainer />
      {/* Global Admin Flagged Alert Notification Toast */}
      {flaggedToast && (
        <div style={{
          position:'fixed', bottom:24, right:24, zIndex:99999,
          background:'#1e1b2e', border:'2px solid #dc2626',
          borderRadius:16, padding:'18px 22px', maxWidth:340,
          boxShadow:'0 12px 40px rgba(220,38,38,0.45)',
          animation:'slideUp .4s ease'
        }}>
          <style>{`@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}`}</style>
          <button onClick={() => setFlaggedToast(null)} style={{ position:'absolute', top:8, right:12, background:'none', border:'none', color:'#94a3b8', fontSize:18, cursor:'pointer' }}>&#10005;</button>
          <div style={{ fontSize:22, marginBottom:6 }}>&#x1F6A8;</div>
          <div style={{ color:'#f87171', fontWeight:800, fontSize:14, marginBottom:6 }}>HIGH-RISK VEHICLE DETECTED</div>
          <div style={{ fontFamily:'monospace', fontSize:20, fontWeight:800, color:'#fbbf24', letterSpacing:3, marginBottom:6 }}>{flaggedToast.plate}</div>
          <div style={{ color:'#e2e8f0', fontSize:12, marginBottom:4 }}>Reason: {flaggedToast.reason}</div>
          <div style={{ color:'#4ade80', fontSize:11, marginBottom:10 }}>&#x2705; Authorities silently notified</div>
          <button onClick={() => { setPage('admin-flagged-alerts'); setFlaggedToast(null); }} style={{ background:'#dc2626', color:'#fff', border:'none', borderRadius:8, padding:'7px 16px', fontSize:12, fontWeight:700, cursor:'pointer', width:'100%' }}>
            View Flagged Alerts
          </button>
        </div>
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
